<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afterhours – beat-synced light show</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07030d;--card:#120a1f;--line:#2a1b45;--tx:#f3eefc;--mut:#9a8cb8;--a:#ff2bd6;--b:#2bd9ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#2a0d4d 0,transparent 70%),var(--bg);color:var(--tx);font:15px/1.45 'Space Grotesk',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 40px}
header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
h1{margin:0;font-size:22px;letter-spacing:.18em;text-transform:uppercase;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
header span{color:var(--mut);font-size:12px}
#stage{margin:0 auto 14px;border-radius:16px;overflow:hidden;border:1px solid var(--line);box-shadow:0 0 60px #ff2bd622,0 0 120px #2bd9ff14;position:relative;background:#000}
#cv{width:100%;height:100%;display:block}
#bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
#tag{position:absolute;top:10px;left:12px;font-size:11px;letter-spacing:.14em;color:#fff9;text-transform:uppercase}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:500}
.drop{display:block;border:1.5px dashed #5a3a96;border-radius:12px;padding:18px;text-align:center;cursor:pointer;color:var(--mut)}
.drop.on,.drop:hover{border-color:var(--a);color:var(--tx)}
.drop b{color:var(--tx);display:block;font-size:16px}
input[type=file]{display:none}
input[type=color]{width:40px;height:30px;border:1px solid var(--line);border-radius:8px;background:#0b0615;padding:2px;cursor:pointer}
textarea{width:100%;background:#0b0615;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font:inherit;resize:none;height:64px}
.field{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;align-items:start;margin-bottom:14px}
.field.c{align-items:center}
.lb{padding-top:10px;color:var(--mut);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
@media(max-width:560px){.field{grid-template-columns:1fr}}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:#0b0615;border:1px solid var(--line);color:var(--tx);border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer}
.chip.on{border-color:transparent;background:linear-gradient(90deg,#ff2bd633,#2bd9ff33);box-shadow:inset 0 0 0 1px var(--a)}
label.t{display:flex;gap:6px;align-items:center;color:var(--mut);cursor:pointer}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;letter-spacing:.06em;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--a),#7b2bff 55%,var(--b))}
.btn.s{background:#1b1030;border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
#st{color:var(--mut);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>Afterhours</h1><span>beat-synced light show</span></header>
<div id="stage"><canvas id="cv"></canvas><div id="tag">demo · 120 bpm</div><div id="bar"></div></div>

<div class="card">
<h2>1 · Audio</h2>
<label class="drop" id="dz"><input type="file" id="fi" accept="audio/*"><b id="fn">Drop your song or beat here</b>mp3, wav, m4a</label>
</div>

<div class="card" id="imgcard" style="display:none">
<h2>Image</h2>
<label class="drop" id="idz"><input type="file" id="ii" accept="image/*"><b id="inm">Drop an image here, or click to choose</b>jpg, png, webp. The filter is applied on top, and the image moves with the music</label>
<div class="row" style="margin-top:12px;gap:12px"><label class="t" style="flex:1;min-width:200px;gap:10px">Size <input type="range" id="isz" min="15" max="400" value="100" style="flex:1;accent-color:#ff2bd6"></label><label class="t" style="flex:1;min-width:200px;gap:10px">Horizontal <input type="range" id="ipx" min="-100" max="100" value="0" style="flex:1;accent-color:#2bd9ff"></label><label class="t" style="flex:1;min-width:200px;gap:10px">Vertical <input type="range" id="ipy" min="-100" max="100" value="0" style="flex:1;accent-color:#2bd9ff"></label><button class="chip" id="irs">Reset</button></div>
<div style="color:var(--mut);font-size:12px;margin-top:8px">Tip: drag the image to move it, and use the mouse wheel to zoom.</div>
</div>

<div class="card">
<h2>2 · Style</h2>
<div class="field"><span class="lb">Scene</span><div class="row"><button class="chip on" data-m="auto" title="Switches scene automatically on drops">Auto</button><button class="chip" data-m="rings">Tunnel</button><button class="chip" data-m="organic">Organic</button><button class="chip" data-m="particles">Particles</button><button class="chip" data-m="orbits">Orbits</button><button class="chip" data-m="hyper">Hyperspace</button><button class="chip" data-m="image">Image</button></div></div>
<div class="field c"><span class="lb" style="padding:0">Intensity</span><input type="range" id="int" min="30" max="160" value="100" style="accent-color:#ff2bd6"></div>
<div class="field"><span class="lb">Filter</span><div class="row"><button class="chip on" data-fl="0">None</button><button class="chip" data-fl="1">VHS</button><button class="chip" data-fl="2">CRT</button><button class="chip" data-fl="3">Glitch</button><button class="chip" data-fl="4">Film</button></div></div>
<div class="field c"><span class="lb" style="padding:0">Filter strength</span><input type="range" id="fa" min="10" max="100" value="70" style="accent-color:#2bd9ff"></div>
<div class="field"><span class="lb">Colors</span><div><div class="row" id="pals"><button class="chip on" data-p="rave">Rave</button><button class="chip" data-p="inferno">Inferno</button><button class="chip" data-p="toxic">Toxic</button><button class="chip" data-p="ice">Ice</button><button class="chip" data-p="synth">Synth</button><button class="chip" data-p="custom">Custom</button></div>
<div class="row" id="cust" style="display:none;margin-top:10px;gap:12px"><span style="color:var(--mut)">Count</span><button class="chip" data-cn="1">1</button><button class="chip" data-cn="2">2</button><button class="chip on" data-cn="3">3</button><label class="t"><span id="cl1">60 %</span><input type="color" id="c1" value="#ff2bd6"></label><label class="t" id="cw2"><span id="cl2">30 %</span><input type="color" id="c2" value="#2bd9ff"></label><label class="t" id="cw3"><span id="cl3">10 %</span><input type="color" id="c3" value="#ffffff"></label></div></div></div>
<div class="field"><span class="lb">Effects</span><div class="row" style="gap:18px"><label class="t"><input type="checkbox" id="laser" checked> Lasers</label><label class="t"><input type="checkbox" id="strobe" checked> Strobe</label><label class="t"><input type="checkbox" id="fxon" checked> Glow</label></div></div>
</div>

<div class="card">
<h2>3 · Export</h2>
<div class="field"><span class="lb">Format</span><div class="row"><button class="chip on" data-f="h">16:9</button><button class="chip" data-f="v">9:16</button></div></div>
<div class="field" style="margin-bottom:0"><span class="lb">Resolution</span><div class="row"><button class="chip" data-q="720">720p</button><button class="chip on" data-q="1080">1080p</button></div></div>
</div>

<div class="btns">
<button class="btn s" id="play" disabled>▶ Play</button>
<button class="btn" id="exp" disabled>Export video</button>
</div>
<div id="st">Upload a song to start. Until then you see a demo.</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/MaskPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
const $=s=>document.querySelector(s), add=THREE.AdditiveBlending;
const cv=$('#cv'), R=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);
const S=new THREE.Scene(); S.fog=new THREE.FogExp2(0x050109,.03);
const cam=new THREE.PerspectiveCamera(62,16/9,.1,120);
let FW=1280,FH=720;
var QH=1080,fmtV='h';
function setFmt(v){fmtV=v;const LL=QH===1080?1920:1280,SS=QH===1080?1080:720;FW=v==='v'?SS:LL;FH=v==='v'?LL:SS;R.setSize(FW,FH,false);if(comp)comp.setSize(FW,FH);cam.aspect=FW/FH;cam.updateProjectionMatrix();const s=$('#stage');s.style.aspectRatio=FW+'/'+FH;s.style.width='min(100%,'+(66*FW/FH)+'vh)'}
setFmt('h');

const P={rave:[0,.14,.33,.5,.62,.8,.9],inferno:[0,.02,.05,.09,.96],toxic:[.27,.33,.4,.78,.85],ice:[.5,.54,.6,.68,.76],synth:[.78,.85,.92,.52,.58]};
/* Egen palett: 1-3 fritt valgte farger (også hvit) etter 60-30-10-regelen. hueAt gir da en posisjon i en fargeløype, og setHSL slår opp i den. */
let CUST=false,custN=3,LUT=null;const _setHSL=THREE.Color.prototype.setHSL;
THREE.Color.prototype.setHSL=function(h,sa,l){
  if(!CUST||!LUT)return _setHSL.call(this,h,sa,l);
  const u=h-Math.floor(h),k=(u*255.999|0)*3;let r=LUT[k],g=LUT[k+1],b=LUT[k+2];
  const ll=(l-.5)*2;if(ll>0){r+=(1-r)*ll;g+=(1-g)*ll;b+=(1-b)*ll}else{const m=1+ll;r*=m;g*=m;b*=m}
  if(sa<1){const y=.299*r+.587*g+.114*b;r=y+(r-y)*sa;g=y+(g-y)*sa;b=y+(b-y)*sa}
  this.r=r;this.g=g;this.b=b;return this;
};
function buildCust(){
  const hx=v=>[parseInt(v.slice(1,3),16)/255,parseInt(v.slice(3,5),16)/255,parseInt(v.slice(5,7),16)/255];
  const cols=['#c1','#c2','#c3'].slice(0,custN).map(q=>hx(document.querySelector(q).value)),n=cols.length;
  LUT=new Float32Array(256*3);
  for(let i=0;i<256;i++){const pos=i/256*n,k=Math.floor(pos),f=pos-k,a=cols[k%n],b=cols[(k+1)%n];for(let c=0;c<3;c++)LUT[i*3+c]=a[c]+(b[c]-a[c])*f}
  const rep=custN===1?[[0,1]]:custN===2?[[0,7],[.5,3]]:[[0,6],[1/3,3],[2/3,1]],o=[];
  rep.forEach(([u,c])=>{for(let i=0;i<c;i++)o.push(u)});return o;
}
let pal=P.rave,shift=0,shiftF=0,lastShiftT=-9,laserOn=true,strobe=true;
const hueAt=i=>{const L=pal.length,s=shiftF+i,a=Math.floor(s),f=s-a,h0=pal[((a%L)+L)%L],h1=pal[(((a+1)%L)+L)%L];let d=h1-h0;if(d>.5)d-=1;if(d<-.5)d+=1;const h=h0+d*f;return h-Math.floor(h)};

const gt=(()=>{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,'rgba(255,255,255,.45)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const FY=-3.5,_v=new THREE.Vector3(),bg=new THREE.Color();

const floor=new THREE.Mesh(new THREE.PlaneGeometry(120,120),new THREE.MeshBasicMaterial({color:0x040207}));floor.rotation.x=-Math.PI/2;floor.position.y=FY;S.add(floor);
const grid=new THREE.GridHelper(120,60,0xffffff,0xffffff);grid.position.y=FY+.01;grid.material.transparent=true;S.add(grid);

const VS='varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){vUv=uv;vec4 mv=modelViewMatrix*vec4(position,1.);vN=normalize(normalMatrix*normal);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}';
const FS='uniform vec3 c;uniform float k;varying vec2 vUv;varying vec3 vN;varying vec3 vV;void main(){float f=pow(abs(dot(normalize(vN),normalize(vV))),1.4);float a=pow(vUv.y,1.3)*f*k;gl_FragColor=vec4(c,a);}';
const NB=10,beams=[];
for(let i=0;i<NB;i++){
  const a=i/NB*Math.PI*2,g=new THREE.Group();g.position.set(Math.cos(a)*7,9,Math.sin(a)*7-2);
  const geo=new THREE.CylinderGeometry(.04,1.5,14,40,1,true);geo.translate(0,-7,0);
  const m=new THREE.ShaderMaterial({uniforms:{c:{value:new THREE.Color()},k:{value:1}},vertexShader:VS,fragmentShader:FS,transparent:true,blending:add,depthWrite:false,side:THREE.DoubleSide});
  g.add(new THREE.Mesh(geo,m));S.add(g);
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(6,6),new THREE.MeshBasicMaterial({map:gt,transparent:true,blending:add,depthWrite:false}));
  sp.rotation.x=-Math.PI/2;sp.position.y=FY+.03;S.add(sp);
  beams.push({g,m,sp,tx:0,tz:0,ph:Math.random()*6});
}
const NL=14,lasers=[];
for(let i=0;i<NL;i++){
  const g=new THREE.Group();g.position.set(0,-.5,-11);
  const geo=new THREE.CylinderGeometry(.02,.02,40,6);geo.rotateX(Math.PI/2);geo.translate(0,0,20);
  const m=new THREE.MeshBasicMaterial({transparent:true,blending:add,depthWrite:false,opacity:0});
  g.add(new THREE.Mesh(geo,m));S.add(g);lasers.push({g,m});
}
const core=new THREE.Group();core.position.y=.8;S.add(core);
const ico=new THREE.Mesh(new THREE.IcosahedronGeometry(1.4,1),new THREE.MeshBasicMaterial({wireframe:true,transparent:true,opacity:.9,blending:add}));core.add(ico);
const orb=new THREE.Mesh(new THREE.SphereGeometry(.7,24,24),new THREE.MeshBasicMaterial({transparent:true,opacity:.9,blending:add}));core.add(orb);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,transparent:true,blending:add,depthWrite:false}));halo.scale.set(9,9,1);core.add(halo);
const rings=[0,1,2].map(i=>{const r=new THREE.Mesh(new THREE.TorusGeometry(2+i*.6,.025,8,96),new THREE.MeshBasicMaterial({transparent:true,opacity:.8,blending:add}));r.rotation.set(i*1.1,i*.7,0);core.add(r);return r});
const waves=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.RingGeometry(.96,1,96),new THREE.MeshBasicMaterial({transparent:true,opacity:0,blending:add,side:THREE.DoubleSide,depthWrite:false}));m.rotation.x=-Math.PI/2;m.position.y=FY+.04;S.add(m);waves.push({m,a:0,s:1})}
let wi=0;
const bars=[];for(let i=0;i<64;i++){const a=i/64*Math.PI*2,m=new THREE.Mesh(new THREE.BoxGeometry(.28,1,.28).translate(0,.5,0),new THREE.MeshBasicMaterial());m.position.set(Math.cos(a)*6,FY,Math.sin(a)*6);m.rotation.y=-a;m.scale.y=.1;S.add(m);bars.push(m)}
const NP=1200,pp=new Float32Array(NP*3);for(let i=0;i<NP;i++){pp[i*3]=(Math.random()-.5)*34;pp[i*3+1]=FY+Math.random()*13;pp[i*3+2]=(Math.random()-.5)*34}
const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pm=new THREE.PointsMaterial({map:gt,size:.55,transparent:true,opacity:.28,blending:add,depthWrite:false});
const haze=new THREE.Points(pg,pm);S.add(haze);

/* Endeløs tunnel */
let mode='tunnel',tstyle='rings',kT=-9,camZ=0,spd=10,phaseT=0,roll=0,ver=0,swT=-99,pv=0,ov=0,hid=0,hy=0,hsp=1,sfOp=0,og=0,at=0;
const TS=new THREE.Scene();TS.fog=new THREE.FogExp2(0x000000,.04);
const NR=60,SPC=2.2,tg={},sg={};
const getG=n=>tg[n]||(tg[n]=new THREE.TorusGeometry(1,.028,6,n));
const getS=n=>{n=n>16?16:n;if(!sg[n]){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,c=Math.cos(a),s=Math.sin(a);p.push(c*.55,s*.55,0,c,s,0)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(p,3));sg[n]=g}return sg[n]};
let ph={};
function newPhase(){const o=[3,4,5,6,8,12,64];ph={sides:o[Math.random()*o.length|0],twist:(Math.random()-.5)*.45,rad:4+Math.random()*3,spoke:Math.random()<.45,inner:Math.random()<.6};if(tstyle==='organic'){ph.sides=64;ph.spoke=false;ph.inner=true;ph.twist*=.4}}
newPhase();
const tun=[];
function place(r,z){r.z=z;r.g.position.z=z;style(r,true)}
function style(r,snap){r.ver=ver;r.org=tstyle==='organic';r.rdT=ph.rad;r.baseT=r.z*ph.twist;if(snap){r.rd=r.rdT;r.base=r.baseT}else r.pu=1;
  r.A.geometry=getG(ph.sides);r.B.geometry=getG(ph.sides===64&&tstyle!=='organic'?6:ph.sides);r.B.visible=ph.inner;r.C.geometry=getS(ph.sides);r.C.visible=ph.spoke}
for(let i=0;i<NR;i++){
  const g=new THREE.Group(),mk=()=>new THREE.MeshBasicMaterial({transparent:true,blending:add,depthWrite:false});
  const A=new THREE.Mesh(getG(6),mk()),B=new THREE.Mesh(getG(6),mk()),C=new THREE.LineSegments(getS(6),new THREE.LineBasicMaterial({transparent:true,blending:add,depthWrite:false}));
  g.add(A,B,C);TS.add(g);const r={g,A,B,C,z:0,rd:6,base:0,pu:0};tun.push(r);place(r,-i*SPC);
}
const NS=900,sp=new Float32Array(NS*3);
for(let i=0;i<NS;i++){const a=Math.random()*6.283,rr=1+Math.random()*7;sp[i*3]=Math.cos(a)*rr;sp[i*3+1]=Math.sin(a)*rr;sp[i*3+2]=-Math.random()*132}
const sGeo=new THREE.BufferGeometry();sGeo.setAttribute('position',new THREE.BufferAttribute(sp,3));
const sMat=new THREE.PointsMaterial({map:gt,size:.35,transparent:true,opacity:.8,blending:add,depthWrite:false});
const stars=new THREE.Points(sGeo,sMat);stars.frustumCulled=false;TS.add(stars);
const vGlow=new THREE.Sprite(new THREE.SpriteMaterial({map:gt,transparent:true,blending:add,depthWrite:false}));vGlow.scale.set(70,70,1);TS.add(vGlow);
const PE=3,kh=new Float32Array(16),_pc=new THREE.Color();let khi=0;
function mkP(n){const pos=new Float32Array(n*(PE+1)*3),col=new Float32Array(n*(PE+1)*3),dat=new Float32Array(n*4);for(let i=0;i<n;i++){dat[i*4]=Math.random()*6.283;dat[i*4+1]=2.5+Math.random()*5;dat[i*4+2]=-Math.random()*132;dat[i*4+3]=.3+Math.random()*.9}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({map:gt,size:.5,transparent:true,opacity:.85,blending:add,depthWrite:false,vertexColors:true}),p=new THREE.Points(g,m);p.visible=false;p.frustumCulled=false;TS.add(p);return{p,pos,col,dat,n,m,t:0}}
const PA=mkP(1100),PB=mkP(1100);
/* Partikler: levende farger fra hele paletten, og ekko-spor som "ristes av" på kick. Ekkoets lengde følger Intensitet. */
function stepP(P,dir,hue,wv,dt){const{pos,col,dat,n,m}=P;P.t+=dt*(.1+energy*.15);
  const L=(.05+.16*INT)*(1+kick*1.2+energy*.8);
  for(let i=0;i<n;i++){let z=dat[i*4+2];if(z>camZ+3){z-=132*Math.ceil((z-camZ-3)/132);dat[i*4+2]=z}
    const d=camZ-z,w=Math.exp(-Math.pow((d-wv)/5,2)),sp=dat[i*4+3],a0=dat[i*4]+P.t*dir*sp+z*.05,r0=dat[i*4+1]*(1+(w*.18+bassS*.1)*INT)+Math.sin(z*.2+T*.5)*.4;
    _pc.setHSL(hueAt((i*.004+z*.02)%4+(dir<0?2:0)),1,Math.min(.8,.55+w*.2+kick*.1));
    for(let g=0;g<=PE;g++){
      const kk=kh[(khi-g*2)&15],sh=kk*(.12+.22*INT),ang=a0-dir*g*L*(.6+.4*sp)+sh*.06*Math.sin(i*7.7+T*29+g),rad=r0*(1+g*kk*.05)+sh*Math.sin(i*12.9+T*37+g)*.5,idx=(g*n+i)*3,bf=Math.pow(1-g/(PE+1),1.7);

  if(!f)return;audio.src=URL.createObjectURL(f);audio.load();loaded=true;
  $('#fn').textContent=f.name;$('#play').disabled=$('#exp').disabled=false;$('#tag').textContent=f.name.replace(/\.[^.]+$/,'');
  st('Ready. Press play to preview the show, or export right away.');
}
$('#fi').onchange=e=>load(e.target.files[0]);
const dz=$('#dz');
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('on')}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('on')}));
dz.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
$('#play').onclick=async()=>{initAudio();await ac.resume();if(audio.paused){await audio.play();$('#play').textContent='❚❚ Pause'}else{audio.pause();$('#play').textContent='▶ Play'}};
audio.onended=()=>{if(!exporting)$('#play').textContent='▶ Play'};

function setPal(n){CUST=n==='custom';pal=CUST?buildCust():P[n];$('#cust').style.display=CUST?'flex':'none';document.querySelectorAll('#pals .chip').forEach(c=>c.classList.toggle('on',c.dataset.p===n))}
function custUpd(){const L=custN===1?['100 %']:custN===2?['70 %','30 %']:['60 %','30 %','10 %'];L.forEach((t,i)=>$('#cl'+(i+1)).textContent=t);$('#cw2').style.display=custN>=2?'flex':'none';$('#cw3').style.display=custN>=3?'flex':'none';document.querySelectorAll('[data-cn]').forEach(x=>x.classList.toggle('on',+x.dataset.cn===custN));if(CUST)pal=buildCust()}
document.querySelectorAll('[data-cn]').forEach(c=>c.onclick=()=>{custN=+c.dataset.cn;custUpd()});
['c1','c2','c3'].forEach(id=>$('#'+id).oninput=()=>{if(CUST)pal=buildCust()});
custUpd();
document.querySelectorAll('#pals .chip').forEach(c=>c.onclick=()=>setPal(c.dataset.p));
document.querySelectorAll('[data-f]').forEach(c=>c.onclick=()=>{if(exporting)return;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===c));setFmt(c.dataset.f)});
document.querySelectorAll('[data-m]').forEach(c=>c.onclick=()=>{const v=c.dataset.m;if(v==='auto'){autoOn=true;lastDrop=T}else{autoOn=false;setScene(v);flash=.25}document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('on',autoOn?x.dataset.m==='auto':x.dataset.m===cur))});
$('#int').oninput=e=>INT=e.target.value/100;document.querySelectorAll('[data-q]').forEach(c=>c.onclick=()=>{if(exporting)return;QH=+c.dataset.q;document.querySelectorAll('[data-q]').forEach(x=>x.classList.toggle('on',x===c));setFmt(fmtV)});
$('#fxon').onchange=e=>fxOn=e.target.checked;
document.querySelectorAll('[data-fl]').forEach(c=>c.onclick=()=>{FM=+c.dataset.fl;document.querySelectorAll('[data-fl]').forEach(x=>x.classList.toggle('on',x===c))});
$('#fa').oninput=e=>FA=e.target.value/100;
$('#ii').onchange=e=>loadImg(e.target.files[0]);
function imgSync(){$('#isz').value=Math.round(IZm*100);$('#ipx').value=Math.round(IPx*100);$('#ipy').value=Math.round(IPy*100)}
$('#isz').oninput=e=>IZm=e.target.value/100;$('#ipx').oninput=e=>IPx=e.target.value/100;$('#ipy').oninput=e=>IPy=e.target.value/100;
$('#irs').onclick=()=>{IZm=1;IPx=0;IPy=0;imgSync()};
(()=>{const st=$('#stage');let dr=null;
  st.addEventListener('pointerdown',e=>{if(cur!=='image')return;dr={x:e.clientX,y:e.clientY};st.setPointerCapture(e.pointerId);st.style.cursor='grabbing'});
  st.addEventListener('pointermove',e=>{if(!dr)return;const r=st.getBoundingClientRect();IPx=Math.max(-1,Math.min(1,IPx+(e.clientX-dr.x)/r.width));IPy=Math.max(-1,Math.min(1,IPy-(e.clientY-dr.y)/r.height));dr={x:e.clientX,y:e.clientY};imgSync()});
  const up=()=>{dr=null;st.style.cursor=cur==='image'?'grab':''};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  st.addEventListener('wheel',e=>{if(cur!=='image')return;e.preventDefault();IZm=Math.max(.15,Math.min(4,IZm*Math.exp(-e.deltaY*.001)));imgSync()},{passive:false});
})();
const idz=$('#idz');['dragover','dragenter'].forEach(ev=>idz.addEventListener(ev,e=>{e.preventDefault();idz.classList.add('on')}));
['dragleave','drop'].forEach(ev=>idz.addEventListener(ev,e=>{e.preventDefault();idz.classList.remove('on')}));
idz.addEventListener('drop',e=>loadImg(e.dataTransfer.files[0]));
$('#laser').onchange=e=>laserOn=e.target.checked;$('#strobe').onchange=e=>strobe=e.target.checked;

let DL=null;(window.claude?claude.use('downloads'):Promise.resolve(null)).then(d=>DL=d).catch(()=>{});
let curRec=null;
$('#exp').onclick=async()=>{
  if(exporting){if(curRec&&curRec.state!=='inactive'){audio.pause();audio.onended=null;curRec.stop()}return}
  if(!loaded)return;initAudio();await ac.resume();
  const mt=['video/mp4;codecs=avc1.640033,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t));
  if(!mt){st('Your browser does not support video recording. Try Chrome or Safari.');return}
  const stream=cv.captureStream(60);stream.addTrack(dest.stream.getAudioTracks()[0]);
  const rec=new MediaRecorder(stream,{mimeType:mt,videoBitsPerSecond:QH===1080?24e6:14e6}),ch=[];curRec=rec;
  rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
  rec.onstop=async()=>{
    exporting=false;curRec=null;audio.onended=()=>{if(!exporting)$('#play').textContent='▶ Play'};$('#exp').disabled=$('#play').disabled=false;$('#exp').textContent='Export video';$('#play').textContent='▶ Play';
    const blob=new Blob(ch,{type:mt.split(';')[0]}),ext=mt.includes('mp4')?'mp4':'webm';
    if(DL){try{await DL.save({filename:'afterhours-video.'+ext,data:blob});{const fps=Math.round(efr/((performance.now()-eT)/1000));st('Done! The video is saved. Average '+fps+' frames/s'+(fps<50?'. Your machine could not keep up with 60, try 720p for a smoother video.':'.'))}}catch(e){st('Saving was cancelled. Press export to try again.')}}
    else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='afterhours-video.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);st('Done! Your download should start now.')}
  };
  audio.currentTime=0;exporting=true;efr=0;eT=performance.now();$('#play').disabled=true;$('#exp').textContent='■ Stop and save';
  st('Recording in real time. Keep this tab in the foreground. Press “Stop and save” when you want to finish.');
  audio.onended=()=>rec.stop();rec.start(500);await audio.play();
};

try{if(parent!==window){document.body.style.minHeight='0';const w=document.querySelector('.wrap'),send=()=>{const h=Math.ceil(w.getBoundingClientRect().height+parseFloat(getComputedStyle(w).paddingTop||0)*0+8);parent.postMessage({ah:'h',h:h},'*')};new ResizeObserver(send).observe(w);addEventListener('load',send);send()}}catch(e){}
</script>
